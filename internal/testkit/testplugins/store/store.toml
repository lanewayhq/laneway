# store: a test Engine with two Service Domains, its API at the files
# Service Domain and its console at the store-console one. Tests make the
# fake container engine serve its image's ports with HTTP servers.
name = "store"
default_version = "1"
image = "example.test/store"
port = 7480
web_port = 7481
data_dir = "/data"

[[ready]]
kind = "http"

[[domains]]
label = "files"
port = 7480

[[domains]]
label = "store-console"
port = 7481
